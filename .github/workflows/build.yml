name: Compilar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Python (verificación balística y gráficos)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar balística (Python + núcleo Kotlin)
        run: |
          pip install numpy pillow
          python tools/verify_ballistics.py

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore desde Secrets (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Compilar APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          [ -z "$SIGNING_STORE_PASSWORD" ] && unset SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SniperAR-${{ github.run_number }}.apk

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SniperAR-apk
          path: SniperAR-*.apk

      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sniper AR · build ${{ github.run_number }}
          body: |
            APK compilado automáticamente desde ${{ github.sha }}.
            Descargalo desde el celular e instalalo (permitir "orígenes desconocidos").
          files: SniperAR-*.apk
          make_latest: true
